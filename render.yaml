services:
  - type: web
    name: gym-management
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "from app import app; from database import init_db; init_db(app)"
    startCommand: gunicorn "app:app" --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
