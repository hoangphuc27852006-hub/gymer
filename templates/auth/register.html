<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - GYM FIT</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #c0392b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background-color: white;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header i {
            font-size: 3rem;
            color: #c0392b;
            margin-bottom: 10px;
        }

        .login-header h2 {
            font-weight: 700;
            color: #1a1a2e;
        }

        .btn-primary {
            background-color: #c0392b;
            border-color: #c0392b;
            padding: 10px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: #a93226;
            border-color: #a93226;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="login-card">
                    <div class="login-header">
                        <i class="fa-solid fa-dumbbell"></i>
                        <h2>GYM FIT</h2>
                        <p class="text-muted">Đăng Ký Tài Khoản Hội Viên</p>
                    </div>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="mb-3">
                            <label for="ho_ten" class="form-label fw-bold">Họ và tên <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
                                <input type="text" class="form-control" id="ho_ten" name="ho_ten" required
                                       value="{{ form.get('ho_ten', '') }}" placeholder="Nhập họ và tên">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="sdt" class="form-label fw-bold">Số điện thoại</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                                <input type="text" class="form-control" id="sdt" name="sdt"
                                       value="{{ form.get('sdt', '') }}" placeholder="Nhập số điện thoại">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="ten_dang_nhap" class="form-label fw-bold">Tên đăng nhập <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                <input type="text" class="form-control" id="ten_dang_nhap" name="ten_dang_nhap" required
                                       value="{{ form.get('ten_dang_nhap', '') }}" placeholder="Chọn tên đăng nhập">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="mat_khau" class="form-label fw-bold">Mật khẩu <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" id="mat_khau" name="mat_khau" required
                                       placeholder="Tối thiểu 6 ký tự">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="xac_nhan_mat_khau" class="form-label fw-bold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" id="xac_nhan_mat_khau" name="xac_nhan_mat_khau" required
                                       placeholder="Nhập lại mật khẩu">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-2">ĐĂNG KÝ</button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        Đã có tài khoản? <a href="{{ url_for('auth.login') }}">Đăng nhập ngay</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
