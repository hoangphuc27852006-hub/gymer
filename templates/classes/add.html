{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Thêm lớp mới</h2>
    <a href="{{ url_for('classes.index') }}" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Trở lại</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST" action="{{ url_for('classes.add') }}">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="ten_lop" class="form-label">Tên lớp*</label>
                    <input type="text" class="form-control" id="ten_lop" name="ten_lop" required>
                </div>
                <div class="col-md-6">
                    <label for="ma_loai" class="form-label">Loại lớp*</label>
                    <select class="form-select" id="ma_loai" name="ma_loai" required>
                        <option value="">-- Chọn loại lớp --</option>
                        {% for loai in loai_list %}
                        <option value="{{ loai.ma_loai }}">{{ loai.ten_loai }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="ma_pt" class="form-label">Huấn luyện viên*</label>
                    <select class="form-select" id="ma_pt" name="ma_pt" required>
                        <option value="">-- Chọn HLV --</option>
                        {% for pt in pt_list %}
                        <option value="{{ pt.ma_pt }}">{{ pt.ho_ten }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="ma_phong" class="form-label">Phòng tập*</label>
                    <select class="form-select" id="ma_phong" name="ma_phong" required>
                        <option value="">-- Chọn phòng --</option>
                        {% for phong in phong_list %}
                        <option value="{{ phong.ma_phong }}">{{ phong.ten_phong }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Thứ học*</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="thu_hoc" id="t2" value="2">
                    <label class="form-check-label" for="t2">T2</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="thu_hoc" id="t3" value="3">
                    <label class="form-check-label" for="t3">T3</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="thu_hoc" id="t4" value="4">
                    <label class="form-check-label" for="t4">T4</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="thu_hoc" id="t5" value="5">
                    <label class="form-check-label" for="t5">T5</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="thu_hoc" id="t6" value="6">
                    <label class="form-check-label" for="t6">T6</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="thu_hoc" id="t7" value="7">
                    <label class="form-check-label" for="t7">T7</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="thu_hoc" id="cn" value="8">
                    <label class="form-check-label" for="cn">CN</label>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="gio_bat_dau" class="form-label">Giờ bắt đầu*</label>
                    <input type="time" class="form-control" id="gio_bat_dau" name="gio_bat_dau" required>
                </div>
                <div class="col-md-6">
                    <label for="gio_ket_thuc" class="form-label">Giờ kết thúc*</label>
                    <input type="time" class="form-control" id="gio_ket_thuc" name="gio_ket_thuc" required>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="ngay_bat_dau" class="form-label">Ngày bắt đầu*</label>
                    <input type="date" class="form-control" id="ngay_bat_dau" name="ngay_bat_dau" required>
                </div>
                <div class="col-md-6">
                    <label for="ngay_ket_thuc" class="form-label">Ngày kết thúc*</label>
                    <input type="date" class="form-control" id="ngay_ket_thuc" name="ngay_ket_thuc" required>
                </div>
            </div>

            <div class="alert alert-info" role="alert">
                <i class="fa-solid fa-circle-info"></i> Hệ thống sẽ tự động tạo tất cả buổi học đến hết khóa
            </div>

            <button type="submit" class="btn btn-primary w-100">Tạo lớp</button>
        </form>
    </div>
</div>
{% endblock %}
