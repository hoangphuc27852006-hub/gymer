{% extends 'base.html' %}

{% block title %}Sửa hội viên - Hệ thống Quản lý Phòng Gym{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0 text-gray-800">Cập nhật thông tin hội viên</h1>
</div>

<div class="card shadow mb-4">
    <div class="card-body">
        <form method="POST" action="{{ url_for('members.edit', ma_hv=hv.ma_hv) }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="ho_ten" class="form-label">Họ tên <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="ho_ten" name="ho_ten" value="{{ hv.ho_ten }}" required>
                </div>
                <div class="col-md-6">
                    <label for="sdt" class="form-label">Số điện thoại</label>
                    <input type="text" class="form-control" id="sdt" name="sdt" value="{{ hv.sdt or '' }}">
                </div>
                <div class="col-md-6">
                    <label for="cccd" class="form-label">CCCD</label>
                    <input type="text" class="form-control" id="cccd" name="cccd" value="{{ hv.cccd or '' }}">
                </div>
                <div class="col-md-6">
                    <label for="ngay_sinh" class="form-label">Ngày sinh</label>
                    <input type="date" class="form-control" id="ngay_sinh" name="ngay_sinh" value="{{ hv.ngay_sinh.strftime('%Y-%m-%d') if hv.ngay_sinh else '' }}">
                </div>
                <div class="col-md-12">
                    <label for="dia_chi" class="form-label">Địa chỉ</label>
                    <input type="text" class="form-control" id="dia_chi" name="dia_chi" value="{{ hv.dia_chi or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label d-block">Giới tính</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gioi_tinh" id="gioi_tinh_nam" value="Nam" {% if hv.gioi_tinh == 'Nam' %}checked{% endif %}>
                        <label class="form-check-label" for="gioi_tinh_nam">Nam</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gioi_tinh" id="gioi_tinh_nu" value="Nữ" {% if hv.gioi_tinh == 'Nữ' %}checked{% endif %}>
                        <label class="form-check-label" for="gioi_tinh_nu">Nữ</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="trang_thai" class="form-label">Trạng thái</label>
                    <select class="form-select" id="trang_thai" name="trang_thai">
                        <option value="active" {% if hv.trang_thai == 'active' %}selected{% endif %}>Đang hoạt động</option>
                        <option value="inactive" {% if hv.trang_thai == 'inactive' %}selected{% endif %}>Ngừng hoạt động</option>
                    </select>
                </div>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Cập nhật</button>
                <a href="{{ url_for('members.index') }}" class="btn btn-secondary"><i class="fas fa-times"></i> Hủy</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
